name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  release:
    types: 
      - created

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ 'windows-latest'] #, 'ubuntu-latest' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'
          architecture: x64
          cache: maven

      - name: Delete xml-apis-ext
        shell: bash
        run: |
          rm -rf ~/.m2/repository/xml-apis/xml-apis-ext

      - name: Test with Maven
        run: mvn -B test
  

 
